[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/macalinao/grabcli"
homepage = "https://github.com/macalinao/grabcli"
readme = "README.md"
keywords = ["grab", "grabfood", "cli", "food-delivery", "philippines"]
categories = ["command-line-utilities"]
authors = ["Ian Macalinao <me@ianm.com>"]

[workspace.dependencies]
grabcli-core = { path = "crates/grabcli-core", version = "0.1.0" }
grabfood = { path = "crates/grabfood", version = "0.1.0" }
grabmart = { path = "crates/grabmart", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bpaf = { version = "0.9", features = ["derive"] }
dirs = "6"
ab_glyph = "0.2"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30"
toml = "0.9"
urlencoding = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
