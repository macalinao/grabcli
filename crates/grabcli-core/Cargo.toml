# Self-contained (no workspace inheritance) so the crate builds when a git
# dependency vendors only this directory (e.g. crate2nix). Keep the versions
# in step with the root Cargo.toml's [workspace.dependencies].
[package]
name = "grabcli-core"
description = "Shared Grab session, auth, hydra and HTTP plumbing for grabcli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/macalinao/grabcli"
homepage = "https://github.com/macalinao/grabcli"
readme = "README.md"
keywords = ["grab", "grabfood", "cli", "food-delivery", "philippines"]
categories = ["command-line-utilities"]
authors = ["Ian Macalinao <me@ianm.com>"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30"
toml = "0.9"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
