# Self-contained (no workspace inheritance) so the crate builds when a git
# dependency vendors only this directory (e.g. crate2nix). Keep the versions
# in step with the root Cargo.toml's [workspace.dependencies].
[package]
name = "grabfood"
description = "GrabFood typed API for grabcli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/macalinao/grabcli"
homepage = "https://github.com/macalinao/grabcli"
readme = "README.md"
keywords = ["grab", "grabfood", "cli", "food-delivery", "philippines"]
categories = ["command-line-utilities"]
authors = ["Ian Macalinao <me@ianm.com>"]

[dependencies]
grabcli-core = { path = "../grabcli-core", version = "0.1.0" }
bpaf = { version = "0.9", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2"

[features]
# The bpaf parser for `ListOpts` (used by the `grab` CLI).
cli = ["dep:bpaf"]

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
